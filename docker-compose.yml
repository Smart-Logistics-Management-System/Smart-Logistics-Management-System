networks:
  logistics_network:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: kargo_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: cargo_logistics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logistics_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kargo_redis
    ports:
      - "6379:6379"
    networks:
      - logistics_network
    restart: unless-stopped

  user-service:
    build: ./user-service
    container_name: user_service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - redis
    networks:
      - logistics_network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cargo_logistics_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATA_REDIS_URL: redis://redis:6379
      SPRING_REDIS_URL: redis://redis:6379

  cargo-service:
    build: ./cargo-service
    container_name: cargo_service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - redis
    networks:
      - logistics_network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cargo_logistics_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_DATA_REDIS_URL: redis://redis:6379
      SPRING_REDIS_URL: redis://redis:6379

  api-gateway:
    build: ./api-gateway
    container_name: api_gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - cargo-service
    networks:
      - logistics_network

volumes:
  postgres_data: